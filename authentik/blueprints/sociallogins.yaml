# Provider + application for ../SocialLogins-authentik, plus a demo login user.
# Secrets come from .env (SOCIALLOGINS_CLIENT_SECRET, DEMO_USER_PASSWORD).
version: 1
metadata:
  name: sso-sample - SocialLogins
  labels:
    blueprints.goauthentik.io/description: OIDC provider and application for the SocialLogins-authentik sample
entries:
- model: authentik_providers_oauth2.oauth2provider
  id: sociallogins-provider
  identifiers:
    name: SocialLogins
  attrs:
    authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
    invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
    client_type: confidential
    client_id: sociallogins
    client_secret: !Env SOCIALLOGINS_CLIENT_SECRET
    # must be explicit when created from a blueprint (empty = every grant rejected)
    grant_types:
    - authorization_code
    - refresh_token
    redirect_uris:
    - matching_mode: strict
      url: https://localhost:5001/signin-authentik
    - matching_mode: strict
      url: https://localhost:5001/signout-callback-authentik
      redirect_uri_type: logout
    signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
    property_mappings:
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
    - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

- model: authentik_core.application
  identifiers:
    slug: sociallogins
  attrs:
    name: SocialLogins
    provider: !KeyOf sociallogins-provider
    meta_launch_url: https://localhost:5001/

- model: authentik_core.user
  identifiers:
    username: demo
  attrs:
    name: Demo User
    email: demo@example.com
    password: !Env DEMO_USER_PASSWORD
